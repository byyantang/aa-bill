<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e94560">
    <title>AA账单 · 云端版</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f23; color: #e0e0e0;
            max-width: 500px; margin: 0 auto; min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #e94560, #c23152);
            padding: 16px 20px; text-align: center;
            font-size: 20px; font-weight: bold;
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header .logout-btn {
            font-size: 12px; background: rgba(255,255,255,0.2);
            color: white; border: none; border-radius: 6px;
            padding: 6px 12px; cursor: pointer;
        }
        .header .online-badge {
            font-size: 11px; background: rgba(39,174,96,0.5);
            padding: 4px 10px; border-radius: 12px; margin-left: 8px;
        }
        .tab-bar {
            display: flex; background: #1a1a2e;
            position: sticky; top: 56px; z-index: 9;
        }
        .tab {
            flex: 1; text-align: center; padding: 12px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            border-bottom: 3px solid transparent; color: #888;
            transition: all 0.2s;
        }
        .tab.active { border-bottom-color: #e94560; color: #e94560; }

        .login-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-card {
            background: #1a1a2e; border-radius: 16px;
            padding: 30px 24px; width: 100%; max-width: 360px;
        }
        .login-card h2 {
            text-align: center; color: #e94560;
            margin-bottom: 24px; font-size: 24px;
        }
        .login-card .input-group { margin-bottom: 16px; }
        .login-card .input-group label {
            display: block; font-size: 13px; color: #888; margin-bottom: 6px;
        }
        .login-card .input-group input {
            width: 100%; padding: 12px; background: #16213e;
            border: 1px solid #252545; border-radius: 8px;
            color: #e0e0e0; font-size: 15px; outline: none;
        }
        .login-card .input-group input:focus { border-color: #e94560; }
        .login-card .btn {
            width: 100%; padding: 14px; background: #e94560;
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .login-card .btn.secondary { background: #252545; margin-top: 12px; }
        .login-card .error {
            color: #e94560; font-size: 13px; text-align: center;
            margin-top: 12px; min-height: 20px;
        }
        .login-card .hint {
            font-size: 12px; color: #666; text-align: center;
            margin-top: 16px; line-height: 1.6;
        }

        .date-filter {
            display: flex; gap: 6px; margin: 12px;
            align-items: center; flex-wrap: wrap;
        }
        .date-filter input[type="date"] {
            flex: 1; min-width: 100px; padding: 8px;
            background: #16213e; border: 1px solid #252545;
            border-radius: 8px; color: #e0e0e0; font-size: 13px;
        }
        .date-filter span { color: #666; font-size: 13px; }
        .date-filter button { padding: 8px 14px; font-size: 13px; }

        .settle-card {
            background: #1a1a2e; margin: 12px;
            border-radius: 14px; padding: 16px;
        }
        .settle-title {
            font-size: 16px; font-weight: bold;
            margin-bottom: 12px; color: #e94560;
        }
        .settle-item {
            display: flex; align-items: center; padding: 10px;
            background: #16213e; border-radius: 10px; margin-bottom: 8px;
        }
        .settle-item .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: #e94560; display: flex; align-items: center;
            justify-content: center; font-weight: bold;
            font-size: 14px; margin-right: 10px; flex-shrink: 0;
        }
        .settle-item .info { flex: 1; min-width: 0; }
        .settle-item .info .line { font-size: 14px; }
        .settle-item .amount {
            font-size: 18px; font-weight: bold;
            color: #e94560; white-space: nowrap;
        }
        .empty-settle {
            text-align: center; color: #666; padding: 20px; font-size: 14px;
        }

        .bill-card {
            background: #1a1a2e; margin: 12px;
            border-radius: 14px; padding: 16px;
        }
        .bill-item {
            display: flex; justify-content: space-between;
            align-items: flex-start; padding: 12px 0;
            border-bottom: 1px solid #252545;
        }
        .bill-item:last-child { border-bottom: none; }
        .bill-item .left { flex: 1; min-width: 0; }
        .bill-item .desc { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .bill-item .meta { font-size: 12px; color: #666; }
        .bill-item .right { text-align: right; margin-left: 10px; }
        .bill-item .amount { font-size: 18px; font-weight: bold; color: #e94560; }
        .bill-item .payer { font-size: 12px; color: #888; }
        .bill-item .del {
            font-size: 12px; color: #e94560;
            cursor: pointer; margin-top: 4px;
        }

        .date-group { margin-bottom: 12px; }
        .date-group-title {
            font-size: 13px; color: #e94560; font-weight: bold;
            padding: 8px 0; border-bottom: 1px solid #252545;
            margin-bottom: 6px;
        }
        .total-summary {
            background: linear-gradient(135deg, #16213e, #1a1a2e);
            border: 1px solid #e94560; border-radius: 12px;
            padding: 14px; margin-top: 12px;
        }
        .total-summary .title {
            font-size: 14px; color: #e94560;
            font-weight: bold; margin-bottom: 8px;
        }
        .total-row {
            display: flex; justify-content: space-between;
            padding: 4px 0; font-size: 14px;
        }
        .total-row .val { font-weight: bold; }

        .form-card {
            background: #1a1a2e; margin: 12px;
            border-radius: 14px; padding: 16px;
        }
        .form-row {
            display: flex; gap: 8px; margin-bottom: 10px;
            align-items: center; flex-wrap: wrap;
        }
        .form-row label { font-size: 13px; color: #888; min-width: 50px; }
        input, select {
            flex: 1; min-width: 80px; padding: 10px;
            background: #16213e; border: 1px solid #252545;
            border-radius: 8px; color: #e0e0e0;
            font-size: 15px; outline: none;
        }
        input:focus, select:focus { border-color: #e94560; }
        button {
            background: #e94560; color: white; border: none;
            border-radius: 8px; padding: 10px 20px; cursor: pointer;
            font-size: 15px; font-weight: bold;
        }
        button:active { opacity: 0.8; }
        button.secondary { background: #252545; }
        .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag {
            padding: 6px 14px; border-radius: 20px; font-size: 13px;
            cursor: pointer; border: 2px solid #252545;
            background: transparent; color: #888;
        }
        .tag.selected {
            border-color: #e94560; color: #e94560;
            background: rgba(233,69,96,0.1);
        }

        .people-card {
            background: #1a1a2e; margin: 12px;
            border-radius: 14px; padding: 16px;
        }
        .person-row {
            display: flex; align-items: center;
            justify-content: space-between; padding: 8px 0;
        }
        .person-row .name { font-size: 15px; }
        .person-row .balance { font-size: 14px; font-weight: bold; }
        .person-row .balance.positive { color: #27ae60; }
        .person-row .balance.negative { color: #e94560; }
        .person-row .del-person {
            color: #e94560; cursor: pointer;
            font-size: 18px; padding: 0 8px;
        }

        .sync-status {
            position: fixed; bottom: 16px; right: 16px;
            font-size: 11px; color: #27ae60;
            background: #1a1a2e; padding: 6px 12px;
            border-radius: 12px; z-index: 100;
        }
        .sync-status.error { color: #e94560; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-container">
        <div class="login-card">
            <h2>💸 AA账单 · 云端</h2>
            <div id="loginForm">
                <div class="input-group">
                    <label>账号名称</label>
                    <input type="text" id="loginAccount" placeholder="输入账号名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码">
                </div>
                <div class="error" id="loginError"></div>
                <button class="btn" onclick="doLogin()">登 录</button>
                <button class="btn secondary" onclick="showRegister()">注册新账号</button>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="input-group">
                    <label>新账号名称</label>
                    <input type="text" id="regAccount" placeholder="输入新账号名">
                </div>
                <div class="input-group">
                    <label>设置密码</label>
                    <input type="password" id="regPassword" placeholder="设置密码（至少4位）">
                </div>
                <div class="input-group">
                    <label>最大同时在线人数</label>
                    <input type="number" id="regMaxUsers" value="10" min="1" max="50">
                </div>
                <div class="error" id="regError"></div>
                <button class="btn" onclick="doRegister()">注 册</button>
                <button class="btn secondary" onclick="showLogin()">返回登录</button>
            </div>
            <div class="hint">
                💡 同一账号多人登录后，<br>数据实时同步，所有人在线可见
            </div>
        </div>
    </div>
</div>

<div id="mainPage" style="display:none;">
    <div class="header">
        <div>
            💸 AA账单
            <span class="online-badge" id="onlineBadge">👥 1人</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">退出</button>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('settle', this)">📊 结算</div>
        <div class="tab" onclick="switchTab('bills', this)">📋 账单</div>
        <div class="tab" onclick="switchTab('add', this)">➕ 记账</div>
        <div class="tab" onclick="switchTab('people', this)">👥 成员</div>
    </div>

    <div id="pageSettle" style="display:block;">
        <div class="date-filter">
            <input type="date" id="settleDateStart">
            <span>至</span>
            <input type="date" id="settleDateEnd">
            <button onclick="filterSettle()">筛选</button>
            <button class="secondary" onclick="showAllSettle()">全部</button>
        </div>
        <div class="settle-card" id="settleResult"></div>
        <div class="settle-card" id="totalSummaryCard"></div>
    </div>

    <div id="pageBills" style="display:none;">
        <div class="date-filter">
            <input type="date" id="billDateStart">
            <span>至</span>
            <input type="date" id="billDateEnd">
            <button onclick="filterBills()">筛选</button>
            <button class="secondary" onclick="showAllBills()">全部</button>
        </div>
        <div class="bill-card" id="billList"></div>
    </div>

    <div id="pageAdd" style="display:none;">
        <div class="form-card">
            <div class="form-row">
                <label>日期</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-row">
                <label>付款人</label>
                <select id="payerSelect"></select>
            </div>
            <div class="form-row">
                <label>金额</label>
                <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01">
            </div>
            <div class="form-row">
                <label>描述</label>
                <input type="text" id="descInput" placeholder="比如：晚餐、打车">
            </div>
            <div class="form-row"><label>参与人</label></div>
            <div class="tag-group" id="memberTags"></div>
            <div class="form-row" style="margin-top:12px;">
                <button onclick="addBill()" style="width:100%;">✅ 添加账单</button>
            </div>
        </div>
    </div>

    <div id="pagePeople" style="display:none;">
        <div class="people-card">
            <div class="form-row">
                <input type="text" id="newPersonInput" placeholder="输入成员名字">
                <button onclick="addPerson()">添加</button>
            </div>
            <div id="personList" style="margin-top:12px;"></div>
        </div>
    </div>

    <div class="sync-status" id="syncStatus">🟢 已同步</div>
</div>

<script>
// Supabase 配置
const SUPABASE_URL = 'https://twrlzlnvneknlxkqlapa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3cmx6bG52bmVrbmx4a3FsYXBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjIwNTYsImV4cCI6MjEwMjA5ODA1Nn0.9efH8Jp2-8KhyBIgRhn0goTLMHrG2JF_yM3S2PiWIJE';

// 用 db 避免与 SDK 全局变量 supabase 冲突
let db = null;
if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log('Supabase 初始化成功');
} else {
    console.error('Supabase SDK 加载失败');
    alert('Supabase SDK 加载失败！请检查网络连接后刷新页面。');
}

let currentAccount = null;
let sessionId = null;
let heartbeatTimer = null;
let people = [];
let bills = [];
let selectedMembers = [];
let realtimeChannel = null;

const today = new Date().toISOString().split('T')[0];
document.getElementById('dateInput').value = today;

const savedSession = localStorage.getItem('aa_cloud_session');
if (savedSession) {
    try {
        const parsed = JSON.parse(savedSession);
        restoreSession(parsed);
    } catch(e) {
        localStorage.removeItem('aa_cloud_session');
    }
}

function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('loginError').textContent = '';
}
function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('regError').textContent = '';
}

async function doLogin() {
    const name = document.getElementById('loginAccount').value.trim();
    const pwd = document.getElementById('loginPassword').value.trim();
    const errEl = document.getElementById('loginError');

    if (!name || !pwd) { errEl.textContent = '请输入账号和密码'; return; }
    if (!db) { errEl.textContent = 'SDK未加载，请刷新页面'; return; }

    errEl.textContent = '登录中...';
    try {
        const { data: accounts, error } = await db
            .from('aa_accounts').select('*').eq('account_name', name).limit(1);
        console.log('查询结果:', { accounts, error });
        if (error) { errEl.textContent = '查询失败: ' + error.message; return; }
        if (!accounts || accounts.length === 0) { errEl.textContent = '账号不存在'; return; }
        const account = accounts[0];
        if (account.password !== pwd) { errEl.textContent = '密码错误'; return; }
        await enterApp(account);
    } catch(e) {
        console.error('登录异常:', e);
        errEl.textContent = '登录失败: ' + e.message;
    }
}

async function doRegister() {
    const name = document.getElementById('regAccount').value.trim();
    const pwd = document.getElementById('regPassword').value.trim();
    const maxUsers = parseInt(document.getElementById('regMaxUsers').value) || 10;
    const errEl = document.getElementById('regError');

    if (!name || name.length < 2) { errEl.textContent = '账号名至少2个字符'; return; }
    if (!pwd || pwd.length < 4) { errEl.textContent = '密码至少4位'; return; }

    errEl.textContent = '注册中...';
    const { data: existing } = await db.from('aa_accounts').select('id').eq('account_name', name).limit(1);
    if (existing && existing.length > 0) { errEl.textContent = '账号名已存在'; return; }

    try {
        const { data: newAccount, error } = await db.from('aa_accounts').insert({
            account_name: name, password: pwd, max_users: Math.min(maxUsers, 50)
        }).select().single();
        if (error) { errEl.textContent = '注册失败: ' + error.message; return; }
        await enterApp(newAccount);
    } catch(e) {
        console.error('注册异常:', e);
        errEl.textContent = '注册失败: ' + e.message;
    }
}

async function enterApp(account) {
    currentAccount = account;
    sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('aa_cloud_session', JSON.stringify({
        accountId: account.id, accountName: account.account_name, sessionId: sessionId
    }));
    try {
        await db.from('aa_sessions').insert({
            account_id: account.id, session_id: sessionId, last_heartbeat: new Date().toISOString()
        });
    } catch(e) { console.warn('创建会话失败:', e); }
    startHeartbeat();
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    await loadAllData();
    subscribeRealtime();
    renderAll();
}

async function restoreSession(parsed) {
    const { data: accounts } = await db.from('aa_accounts').select('*').eq('id', parsed.accountId).limit(1);
    if (!accounts || accounts.length === 0) { localStorage.removeItem('aa_cloud_session'); return; }
    currentAccount = accounts[0];
    sessionId = parsed.sessionId;
    try {
        await db.from('aa_sessions').upsert({
            account_id: currentAccount.id, session_id: sessionId, last_heartbeat: new Date().toISOString()
        }, { onConflict: 'session_id' });
    } catch(e) { console.warn('心跳更新失败:', e); }
    startHeartbeat();
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    await loadAllData();
    subscribeRealtime();
    renderAll();
}

function startHeartbeat() {
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(async () => {
        if (!currentAccount || !sessionId) return;
        try {
            await db.from('aa_sessions').upsert({
                account_id: currentAccount.id, session_id: sessionId, last_heartbeat: new Date().toISOString()
            }, { onConflict: 'session_id' });
        } catch(e) { console.warn('心跳失败:', e); }
        updateOnlineCount();
    }, 30000);
}

async function updateOnlineCount() {
    if (!currentAccount) return;
    const { data: sessions } = await db.from('aa_sessions').select('id')
        .eq('account_id', currentAccount.id)
        .gte('last_heartbeat', new Date(Date.now() - 60000).toISOString());
    document.getElementById('onlineBadge').textContent = '👥 ' + (sessions ? sessions.length : 1) + '人';
}

async function doLogout() {
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    if (realtimeChannel) { db.removeChannel(realtimeChannel); realtimeChannel = null; }
    if (sessionId) { await db.from('aa_sessions').delete().eq('session_id', sessionId); }
    localStorage.removeItem('aa_cloud_session');
    currentAccount = null; sessionId = null; people = []; bills = [];
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('mainPage').style.display = 'none';
}

async function loadAllData() {
    if (!currentAccount) return;
    const { data: p } = await db.from('aa_people').select('*').eq('account_id', currentAccount.id).order('id');
    people = p ? p.map(x => x.name) : [];
    if (people.length === 0) {
        people = ['张三', '李四', '王五'];
        for (const name of people) {
            await db.from('aa_people').insert({ account_id: currentAccount.id, name: name });
        }
    }
    const { data: b } = await db.from('aa_bills').select('*').eq('account_id', currentAccount.id)
        .order('bill_date', { ascending: false }).order('created_at', { ascending: false });
    bills = b || [];
    selectedMembers = [...people];
    updateOnlineCount();
}

function subscribeRealtime() {
    if (!currentAccount) return;
    if (realtimeChannel) { db.removeChannel(realtimeChannel); }
    realtimeChannel = db.channel('aa_changes')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'aa_bills', filter: 'account_id=eq.' + currentAccount.id },
            async (payload) => { console.log('账单变更:', payload.eventType); await loadAllData(); renderAll(); }
        )
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'aa_people', filter: 'account_id=eq.' + currentAccount.id },
            async (payload) => { console.log('成员变更:', payload.eventType); await loadAllData(); renderAll(); }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                document.getElementById('syncStatus').textContent = '🟢 实时同步中';
            } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                document.getElementById('syncStatus').textContent = '🔴 连接断开';
                document.getElementById('syncStatus').classList.add('error');
                setTimeout(subscribeRealtime, 5000);
            }
        });
}

function calculateSettlement(startDate, endDate) {
    const balance = {};
    people.forEach(p => balance[p] = 0);
    const filteredBills = bills.filter(b => {
        if (!startDate || !endDate) return true;
        return b.bill_date >= startDate && b.bill_date <= endDate;
    });
    filteredBills.forEach(bill => {
        balance[bill.payer] += parseFloat(bill.amount);
        const share = parseFloat(bill.amount) / bill.members.length;
        bill.members.forEach(m => { balance[m] -= share; });
    });
    const creditors = [], debtors = [];
    Object.entries(balance).forEach(([name, bal]) => {
        if (bal > 0.01) creditors.push({ name, balance: bal });
        else if (bal < -0.01) debtors.push({ name, balance: -bal });
    });
    creditors.sort((a, b) => b.balance - a.balance);
    debtors.sort((a, b) => b.balance - a.balance);
    const transactions = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
        const amount = Math.min(debtors[i].balance, creditors[j].balance);
        if (amount > 0.01) {
            transactions.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(amount * 100) / 100 });
        }
        debtors[i].balance -= amount; creditors[j].balance -= amount;
        if (debtors[i].balance < 0.01) i++;
        if (creditors[j].balance < 0.01) j++;
    }
    return {
        balance, transactions,
        totalSpent: filteredBills.reduce((s, b) => s + parseFloat(b.amount), 0),
        billCount: filteredBills.length
    };
}

function renderAll() { renderSettle(); renderBills(); renderPeople(); renderPayerSelect(); renderMemberTags(); }

function renderSettle(startDate, endDate) {
    const { balance, transactions, totalSpent, billCount } = calculateSettlement(startDate, endDate);
    const container = document.getElementById('settleResult');
    const rangeLabel = (startDate && endDate) ? startDate + ' ~ ' + endDate : '全部';
    if (billCount === 0) {
        container.innerHTML = '<div class="settle-title">📊 结算结果 (' + rangeLabel + ')</div><div class="empty-settle">该时间段还没有账单</div>';
        document.getElementById('totalSummaryCard').innerHTML = '';
        return;
    }
    let html = '<div class="settle-title">📊 结算结果 - ' + rangeLabel + ' (' + billCount + '笔, ¥' + totalSpent.toFixed(2) + ')</div>';
    if (transactions.length === 0) {
        html += '<div class="empty-settle">✅ 已结清，无需转账</div>';
    } else {
        transactions.forEach(t => {
            html += '<div class="settle-item"><div class="avatar">' + t.from[0] + '</div><div class="info"><div class="line"><span class="name">' + t.from + '</span><span> → </span><span class="name">' + t.to + '</span></div></div><div class="amount">¥' + t.amount.toFixed(2) + '</div></div>';
        });
    }
    html += '<div class="settle-title" style="margin-top:16px;">👤 个人明细</div>';
    Object.entries(balance).forEach(([name, bal]) => {
        html += '<div class="person-row"><span class="name">' + name + '</span><span class="balance ' + (bal >= 0 ? 'positive' : 'negative') + '">' + (bal >= 0 ? '+' : '') + '¥' + bal.toFixed(2) + '</span></div>';
    });
    container.innerHTML = html;
    const all = calculateSettlement();
    if (all.billCount > 0) {
        document.getElementById('totalSummaryCard').innerHTML = '<div class="total-summary"><div class="title">📈 总计 (全部日期)</div><div class="total-row"><span>总账单数</span><span class="val">' + all.billCount + ' 笔</span></div><div class="total-row"><span>总消费</span><span class="val" style="color:#e94560;">¥' + all.totalSpent.toFixed(2) + '</span></div><div class="total-row"><span>人均消费</span><span class="val">¥' + (all.totalSpent / people.length).toFixed(2) + '</span></div></div>';
    }
}

function renderBills(startDate, endDate) {
    const container = document.getElementById('billList');
    const filtered = startDate && endDate ? bills.filter(b => b.bill_date >= startDate && b.bill_date <= endDate) : [...bills];
    if (filtered.length === 0) { container.innerHTML = '<div class="empty-settle" style="padding:40px;">暂无账单</div>'; return; }
    const groups = {};
    filtered.forEach(b => { if (!groups[b.bill_date]) groups[b.bill_date] = []; groups[b.bill_date].push(b); });
    const dates = Object.keys(groups).sort().reverse();
    let html = '';
    dates.forEach(date => {
        const dayTotal = groups[date].reduce((s, b) => s + parseFloat(b.amount), 0);
        html += '<div class="date-group"><div class="date-group-title">📅 ' + date + ' · ' + groups[date].length + '笔 · ¥' + dayTotal.toFixed(2) + '</div>';
        groups[date].forEach(bill => {
            html += '<div class="bill-item"><div class="left"><div class="desc">' + (bill.description || '无描述') + '</div><div class="meta">' + bill.payer + ' 代付 · ' + bill.members.length + '人分摊</div><div class="meta">参与: ' + bill.members.join('、') + '</div></div><div class="right"><div class="amount">¥' + parseFloat(bill.amount).toFixed(2) + '</div><div class="payer">人均 ¥' + (parseFloat(bill.amount) / bill.members.length).toFixed(2) + '</div><div class="del" onclick="deleteBill(' + bill.id + ')">删除</div></div></div>';
        });
        html += '</div>';
    });
    container.innerHTML = html;
}

function renderPeople() {
    const { balance } = calculateSettlement();
    document.getElementById('personList').innerHTML = people.map(p => {
        const bal = balance[p] || 0;
        return '<div class="person-row"><span class="name">' + p + '</span><div style="display:flex;align-items:center;gap:10px;"><span class="balance ' + (bal >= 0 ? 'positive' : 'negative') + '">' + (bal >= 0 ? '+' : '') + '¥' + bal.toFixed(2) + '</span><span class="del-person" onclick="deletePerson(\'' + p + '\')">×</span></div></div>';
    }).join('');
}

function renderPayerSelect() {
    document.getElementById('payerSelect').innerHTML = people.map(p => '<option value="' + p + '">' + p + '</option>').join('');
}

function renderMemberTags() {
    document.getElementById('memberTags').innerHTML = people.map(p => '<div class="tag ' + (selectedMembers.includes(p) ? 'selected' : '') + '" id="tag_' + p + '" onclick="toggleMember(\'' + p + '\')">' + p + '</div>').join('');
}

function toggleMember(name) {
    const idx = selectedMembers.indexOf(name);
    if (idx >= 0) {
        if (selectedMembers.length <= 1) { alert('至少选一个人'); return; }
        selectedMembers.splice(idx, 1);
    } else { selectedMembers.push(name); }
    document.getElementById('tag_' + name).classList.toggle('selected', selectedMembers.includes(name));
}

async function addBill() {
    const date = document.getElementById('dateInput').value;
    const payer = document.getElementById('payerSelect').value;
    const amount = parseFloat(document.getElementById('amountInput').value);
    const description = document.getElementById('descInput').value.trim();
    if (!date) { alert('请选择日期'); return; }
    if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
    if (selectedMembers.length === 0) { alert('至少选一个参与人'); return; }
    const { error } = await db.from('aa_bills').insert({
        account_id: currentAccount.id, bill_date: date, payer: payer,
        amount: amount, description: description || '无描述', members: [...selectedMembers]
    });
    if (error) { alert('添加失败: ' + error.message); return; }
    document.getElementById('amountInput').value = '';
    document.getElementById('descInput').value = '';
    await loadAllData(); renderAll();
    switchTab('settle', document.querySelectorAll('.tab')[0]);
}

async function deleteBill(id) {
    if (!confirm('确定删除？')) return;
    await db.from('aa_bills').delete().eq('id', id);
    await loadAllData(); renderAll();
}

async function addPerson() {
    const name = document.getElementById('newPersonInput').value.trim();
    if (!name) { alert('请输入名字'); return; }
    if (people.includes(name)) { alert('名字已存在'); return; }
    const { error } = await db.from('aa_people').insert({ account_id: currentAccount.id, name: name });
    if (error) { alert('添加失败: ' + error.message); return; }
    document.getElementById('newPersonInput').value = '';
    await loadAllData(); selectedMembers = [...people]; renderAll();
}

async function deletePerson(name) {
    if (people.length <= 1) { alert('至少保留一个成员'); return; }
    const hasBill = bills.some(b => b.payer === name || b.members.includes(name));
    if (hasBill) { alert('该成员有账单记录，请先删除相关账单'); return; }
    await db.from('aa_people').delete().eq('account_id', currentAccount.id).eq('name', name);
    await loadAllData(); selectedMembers = selectedMembers.filter(p => p !== name); renderAll();
}

function switchTab(page, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('[id^="page"]').forEach(p => p.style.display = 'none');
    document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).style.display = 'block';
}

function filterSettle() { renderSettle(document.getElementById('settleDateStart').value, document.getElementById('settleDateEnd').value); }
function showAllSettle() { document.getElementById('settleDateStart').value = ''; document.getElementById('settleDateEnd').value = ''; renderSettle(); }
function filterBills() { renderBills(document.getElementById('billDateStart').value, document.getElementById('billDateEnd').value); }
function showAllBills() { document.getElementById('billDateStart').value = ''; document.getElementById('billDateEnd').value = ''; renderBills(); }
</script>
</body>
</html>
